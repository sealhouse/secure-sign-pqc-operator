apiVersion: v1
kind: Service
metadata:
  annotations:
    # OpenShift's service-ca issues the serving certificate the manager mounts.
    service.beta.openshift.io/serving-cert-secret-name: rhtas-pqc-metrics-cert
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: secure-sign-pqc-operator
    app.kubernetes.io/component: metrics
    app.kubernetes.io/managed-by: kustomize
  name: controller-manager-metrics-service
  namespace: system
spec:
  ports:
  - name: https
    port: 8443
    protocol: TCP
    targetPort: 8443
  selector:
    control-plane: controller-manager
    app.kubernetes.io/name: secure-sign-pqc-operator
