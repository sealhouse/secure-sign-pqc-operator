namespace: rhtas-pqc-operator
namePrefix: rhtas-pqc-
resources:
- ../crd
- ../rbac
- ../manager
- metrics_service.yaml
patches:
# Serves metrics over HTTPS on :8443.
- path: manager_metrics_patch.yaml
  target:
    kind: Deployment
# The operator finds the metrics Service and the scraper's account by name.
replacements:
- source:
    kind: Service
    name: controller-manager-metrics-service
  targets:
  - select:
      kind: Deployment
    fieldPaths:
    - spec.template.spec.containers.[name=manager].env.[name=METRICS_SERVICE].value
    options:
      create: true
- source:
    kind: ServiceAccount
    name: metrics-scraper
  targets:
  - select:
      kind: Deployment
    fieldPaths:
    - spec.template.spec.containers.[name=manager].env.[name=METRICS_SCRAPER].value
    options:
      create: true
