# Create, change and delete SecureSignPQC, for users to bind; the operator does not use it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: secure-sign-pqc-operator
    app.kubernetes.io/managed-by: kustomize
  name: securesignpqc-editor-role
rules:
- apiGroups:
  - pqc.rhtas.redhat.com
  resources:
  - securesignpqcs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - pqc.rhtas.redhat.com
  resources:
  - securesignpqcs/status
  verbs:
  - get
