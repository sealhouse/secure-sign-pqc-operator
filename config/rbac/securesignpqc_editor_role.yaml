# This rule is not used by the project secure-sign-pqc-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the pqc.rhtas.redhat.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: secure-sign-pqc-operator
    app.kubernetes.io/managed-by: kustomize
  name: securesignpqc-editor-role
rules:
- apiGroups:
  - pqc.rhtas.redhat.com
  resources:
  - securesignpqcs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - pqc.rhtas.redhat.com
  resources:
  - securesignpqcs/status
  verbs:
  - get
