# Full access to SecureSignPQC, for users to bind; the operator does not use it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: secure-sign-pqc-operator
    app.kubernetes.io/managed-by: kustomize
  name: securesignpqc-admin-role
rules:
- apiGroups:
  - pqc.rhtas.redhat.com
  resources:
  - securesignpqcs
  verbs:
  - '*'
- apiGroups:
  - pqc.rhtas.redhat.com
  resources:
  - securesignpqcs/status
  verbs:
  - get
