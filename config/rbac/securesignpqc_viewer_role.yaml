# This rule is not used by the project secure-sign-pqc-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to pqc.rhtas.redhat.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: secure-sign-pqc-operator
    app.kubernetes.io/managed-by: kustomize
  name: securesignpqc-viewer-role
rules:
- apiGroups:
  - pqc.rhtas.redhat.com
  resources:
  - securesignpqcs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - pqc.rhtas.redhat.com
  resources:
  - securesignpqcs/status
  verbs:
  - get
