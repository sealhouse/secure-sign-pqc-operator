name: sealhouse-merge

on:
  push:
    branches: [main]

permissions: {}

jobs:
  merge:
    permissions:
      packages: write
    uses: sealhouse/ci/.github/workflows/merge.yaml@e9a060c93a69a23072382616dd5f1431981cd4e0
    with:
      ci-ref: e9a060c93a69a23072382616dd5f1431981cd4e0
      publish: merge-publish
    secrets:
      dispatch-app-id: ${{ secrets.SEALHOUSE_DISPATCH_APP_ID }}
      dispatch-app-key: ${{ secrets.SEALHOUSE_DISPATCH_APP_KEY }}
