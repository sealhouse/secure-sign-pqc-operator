name: sealhouse-merge

on:
  push:
    branches: [main]

permissions: {}

jobs:
  merge:
    permissions:
      packages: write
    uses: sealhouse/ci/.github/workflows/merge.yaml@86fdae8494023c628810745c0b86bd199df54eec
    with:
      ci-ref: 86fdae8494023c628810745c0b86bd199df54eec
      publish: merge-publish
    secrets:
      dispatch-app-id: ${{ secrets.SEALHOUSE_DISPATCH_APP_ID }}
      dispatch-app-key: ${{ secrets.SEALHOUSE_DISPATCH_APP_KEY }}
