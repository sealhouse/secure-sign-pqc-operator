name: sealhouse-merge

on:
  push:
    branches: [main]

permissions: {}

jobs:
  merge:
    permissions:
      packages: write
    uses: sealhouse/ci/.github/workflows/merge.yaml@b20bde1fb3ca9598c78de914d5438add279dd685
    with:
      ci-ref: b20bde1fb3ca9598c78de914d5438add279dd685
      publish: merge-publish
    secrets:
      dispatch-app-id: ${{ secrets.SEALHOUSE_DISPATCH_APP_ID }}
      dispatch-app-key: ${{ secrets.SEALHOUSE_DISPATCH_APP_KEY }}
