name: sealhouse-merge

on:
  push:
    branches: [main]

permissions: {}

jobs:
  merge:
    permissions:
      packages: write
    uses: sealhouse/ci/.github/workflows/merge.yaml@0921e2399d488dd3b68f112ab1b6c819387aec70
    with:
      ci-ref: 0921e2399d488dd3b68f112ab1b6c819387aec70
      publish: merge-publish
    secrets:
      dispatch-app-id: ${{ secrets.SEALHOUSE_DISPATCH_APP_ID }}
      dispatch-app-key: ${{ secrets.SEALHOUSE_DISPATCH_APP_KEY }}
