name: sealhouse-pr

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  pr:
    uses: sealhouse/ci/.github/workflows/pr.yaml@b1d5b917f99d991f75e4c97ed9ecb20d427d7fa8
    with:
      ci-ref: b1d5b917f99d991f75e4c97ed9ecb20d427d7fa8
      lint: lint
      e2e: test-e2e
    secrets:
      dispatch-app-id: ${{ secrets.SEALHOUSE_DISPATCH_APP_ID }}
      dispatch-app-key: ${{ secrets.SEALHOUSE_DISPATCH_APP_KEY }}
