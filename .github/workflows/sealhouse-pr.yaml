name: sealhouse-pr

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  pr:
    uses: sealhouse/ci/.github/workflows/pr.yaml@68135e52c0b56528eff8db0e075d0a90140ccf6d
    with:
      ci-ref: 68135e52c0b56528eff8db0e075d0a90140ccf6d
      lint: lint
      e2e: test-e2e
    secrets:
      dispatch-app-id: ${{ secrets.SEALHOUSE_DISPATCH_APP_ID }}
      dispatch-app-key: ${{ secrets.SEALHOUSE_DISPATCH_APP_KEY }}
