name: sealhouse-pr

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  pr:
    uses: sealhouse/ci/.github/workflows/pr.yaml@b20bde1fb3ca9598c78de914d5438add279dd685
    with:
      ci-ref: b20bde1fb3ca9598c78de914d5438add279dd685
      lint: lint
      e2e: test-e2e
    secrets:
      dispatch-app-id: ${{ secrets.SEALHOUSE_DISPATCH_APP_ID }}
      dispatch-app-key: ${{ secrets.SEALHOUSE_DISPATCH_APP_KEY }}
