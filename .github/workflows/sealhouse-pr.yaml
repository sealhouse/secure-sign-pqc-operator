name: sealhouse-pr

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  pr:
    uses: sealhouse/ci/.github/workflows/pr.yaml@86fdae8494023c628810745c0b86bd199df54eec
    with:
      ci-ref: 86fdae8494023c628810745c0b86bd199df54eec
      lint: lint
      e2e: test-e2e
    secrets:
      dispatch-app-id: ${{ secrets.SEALHOUSE_DISPATCH_APP_ID }}
      dispatch-app-key: ${{ secrets.SEALHOUSE_DISPATCH_APP_KEY }}
